name: M.A.P. regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/map-test-tools" --save-exact playwright@1.56.1 leaflet@1.9.4
          node "$RUNNER_TEMP/map-test-tools/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/map-test-tools/node_modules" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$(node -e "console.log(require('$RUNNER_TEMP/map-test-tools/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Test composer, exports, feeds and map details
        run: node --test tests/*.test.cjs
